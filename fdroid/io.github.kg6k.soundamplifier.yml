AutoName: Sound Amplifier
Summary: Open-source, copylefted Sound Amplifier and loudness booster for Android.
Description: |-
  Sound Amplifier is an open-source, copylefted audio loudness booster for Android.

  Features:
  * Boost & Media Volume Sliders: Adjust target gain from 0% to 100% (up to +60 dB)
    using Android's built-in LoudnessEnhancer API alongside a system media volume slider.
  * Quick Turn On / Turn Off: Pause or restore your last boost percentage with one tap
    from the app header or ongoing notification.
  * Foreground Service: Applies LoudnessEnhancer to global audio session 0 and media
    player audio sessions (actual loudness gain and app compatibility depend on the
    device and Android implementation).
  * Quick Settings Tile (Android 7.0+): Toggles amplification directly on Android 12+
    (opens the app on Android 7.0–11) and displays the active level in the subtitle
    on Android 10+.
  * Visual High-Boost Warning: Highlights the boost indicator in red above 60% with
    an on-screen warning about speaker and hearing risks.
  * Broad Android Compatibility: Supports Android 6.0 Marshmallow (API 23) through
    Android 15 (API 35) with no ads or trackers.

