name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK with R8 Shrinking
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk release-output/SoundAmplifier-v1.0.0-alpha2.apk
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-Alpha-APK
          path: release-output/SoundAmplifier-v1.0.0-alpha2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-alpha2' }}
          name: Sound Amplifier v1.0.0-alpha2 (Alpha Build)
          body: |
            ## Sound Amplifier v1.0.0-alpha2 (Alpha Build)

            ### Download:
            - **`SoundAmplifier-v1.0.0-alpha2.apk`**: Universal APK optimized with R8 shrinking (~5–7 MB, compatible with all Android devices).

            ### Highlights & What's New in Alpha 2:
            - **R8 Full Shrinking & Optimization**: High-performance minified binary (~70% smaller) via R8 dead code and unused resource stripping.
            - **Sleek Symmetrical Design**: Removed redundant preset chips and status badges for a unified, clean tactile look.
            - **Balanced Division Sizing**: Perfectly symmetrical, compact divisions for Boost Amplification and System Media Volume.
            - **Audio Speaker Iconography**: Replaced lightning zap with modern audio speaker and sound waves.
            - **Android 14 & 15 Stability**: Safe broadcast receiver exports (`RECEIVER_EXPORTED`) for audio session hooking on Android 14/15.
            - **Foreground Service & Quick Actions**: Foreground service with ongoing notification status, +40 dB loudness enhancement, and Quick Settings tile.
            - **Crash Reporting & Diagnostics**: Built-in crash logging saved to device storage (`Android/data/io.github.kg6k.soundamplifier/files/crash_reports/`).
            - **Compatibility**: Android 10 (API 29) through Android 15 (API 35) support.
          files: release-output/SoundAmplifier-v1.0.0-alpha2.apk
          draft: false
          prerelease: true
