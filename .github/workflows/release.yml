name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK with R8 Shrinking
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK and Release Notes
        run: |
          mkdir -p release-output
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.5}"
          VERSION_CODE="$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')"
          cp app/build/outputs/apk/release/*.apk "release-output/SoundAmplifier-${TAG_NAME}.apk"
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          {
            echo "## Sound Amplifier ${TAG_NAME}"
            echo ""
            echo "### Download"
            echo "- **\`SoundAmplifier-${TAG_NAME}.apk\`**: Signed Android release APK (Android 6.0 / API 23 through Android 15 / API 35)."
            echo ""
            echo "### Changes in ${TAG_NAME}"
            if [ -f "${CHANGELOG_FILE}" ]; then
              cat "${CHANGELOG_FILE}"
            else
              echo "- Maintenance release ${TAG_NAME} (versionCode ${VERSION_CODE})."
            fi
          } > release-output/release_notes.md
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-Release-APK
          path: release-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Sound Amplifier ${{ github.ref_name }}
          body_path: release-output/release_notes.md
          files: release-output/*.apk
          draft: false
          prerelease: false
