name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK with R8 Shrinking
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.1}"
          cp app/build/outputs/apk/release/*.apk "release-output/SoundAmplifier-${TAG_NAME}.apk"
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-Release-APK
          path: release-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Sound Amplifier ${{ github.ref_name }}
          body: |
            ## Sound Amplifier ${{ github.ref_name }} — Official Stable Release

            ### Download:
            - **`SoundAmplifier-${{ github.ref_name }}.apk`**: Official signed Android APK release (compatible with Android 6.0 Marshmallow through Android 15).

            ### Highlights & Key Features:
            - **Native Audio Loudness Boost**: Enhances media volume up to +60 dB using Android's native `LoudnessEnhancer` audio effects engine across all music, podcasts, and video players.
            - **Android 6.0 to 15 Compatibility**: Backward-compatible with Android 6.0 Marshmallow (`minSdk = 23`) through Android 15 (`targetSdk = 35`).
            - **Quick Settings Tile**: Fast one-tap toggle with real-time amplification status in the notification shade (Android 7.0+).
            - **Visual Safety Limiter**: Dynamic slider color transitions (emerald green $\le$ 60%, bright red $>$ 60%) to prevent hearing damage and speaker blowouts.
            - **Permanent Release Signature**: Signed with official keystore certificate for seamless future app updates.
            - **100% Free & Open Source**: Licensed under GNU General Public License v3.0 (GPL-3.0), zero trackers, zero ads, and zero proprietary blobs.
            - **F-Droid Ready**: Complete Fastlane metadata and F-Droid build recipe included.
          files: release-output/*.apk
          draft: false
          prerelease: false
