name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-output
          for apk in app/build/outputs/apk/debug/*.apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"universal"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-universal.apk
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-arm64-v8a.apk
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-armeabi-v7a.apk
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-x86_64.apk
            else
              cp "$apk" "release-output/SoundAmplifier-v1.0.0-${filename}"
            fi
          done
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-APKs
          path: release-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: Sound Amplifier v1.0.0
          body: |
            ## Sound Amplifier v1.0.0 Release

            ### Architecture-Optimized APK Downloads:
            - **`SoundAmplifier-v1.0.0-arm64-v8a.apk`**: Recommended for 95%+ of modern Android phones (64-bit ARM).
            - **`SoundAmplifier-v1.0.0-universal.apk`**: Guaranteed compatibility across any Android phone or tablet.
            - **`SoundAmplifier-v1.0.0-armeabi-v7a.apk`**: For older 32-bit Android phones.
            - **`SoundAmplifier-v1.0.0-x86_64.apk`**: For Android emulators & Chromebooks.

            ### Features:
            - Native Android Kotlin implementation with Jetpack Compose Material 3 UI.
            - Dual sliders: Boost Amplification (+0% to +100%) and System Media Volume.
            - Real-time Output Spectrum Power visualizer with live frequency response.
            - Background Foreground Service (`mediaPlayback`) with `LoudnessEnhancer`.
            - Android Quick Settings Tile integration (`VolumeBoosterTileService`).
            - Built-in crash diagnostics logger to device storage.
            - Compatible with Android 10 (API 29) to Android 15 (API 35).
          files: release-output/*.apk
          draft: false
          prerelease: false
