name: Build & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK with R8 Shrinking
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk release-output/SoundAmplifier-v1.0.0-alpha1.apk
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-Alpha-APK
          path: release-output/SoundAmplifier-v1.0.0-alpha1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-alpha1
          name: Sound Amplifier v1.0.0-alpha1 (Alpha Build)
          body: |
            ## Sound Amplifier v1.0.0-alpha1 (Alpha Build)

            ### Download:
            - **`SoundAmplifier-v1.0.0-alpha1.apk`**: Universal APK optimized with R8 shrinking (~5–7 MB, compatible with all Android devices).

            ### Features:
            - Optimized lightweight binary (~70% smaller) via R8 dead code and resource elimination.
            - Modern adaptive app launcher icon with glowing amber lightning and audio ripples.
            - 1:1 match of the dark console UI with thick tactile 56dp capsule sliders.
            - 32-bar real-time Output Spectrum Power visualizer with dB readout.
            - Interactive ongoing notification panel progress slider with `[−10%]`, `[+10%]`, `[Max]`, `[Pause]` quick actions.
            - Built-in crash diagnostics system saving detailed reports to `/storage/emulated/0/Android/data/io.github.kg6k.soundamplifier/files/crash_reports/`.
            - Android 10 (API 29) through Android 15 (API 35) support.
          files: release-output/SoundAmplifier-v1.0.0-alpha1.apk
          draft: false
          prerelease: true
