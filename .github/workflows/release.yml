name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-output
          for apk in app/build/outputs/apk/debug/*.apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"universal"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-alpha1-universal.apk
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-alpha1-arm64-v8a.apk
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-alpha1-armeabi-v7a.apk
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" release-output/SoundAmplifier-v1.0.0-alpha1-x86_64.apk
            else
              cp "$apk" "release-output/SoundAmplifier-v1.0.0-alpha1-${filename}"
            fi
          done
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundAmplifier-Alpha-APKs
          path: release-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-alpha1
          name: Sound Amplifier v1.0.0-alpha1 (Alpha Build)
          body: |
            ## Sound Amplifier v1.0.0-alpha1 (Alpha Build)

            ### Architecture-Optimized APK Downloads:
            - **`SoundAmplifier-v1.0.0-alpha1-arm64-v8a.apk`**: Recommended for 95%+ of modern Android phones (64-bit ARM).
            - **`SoundAmplifier-v1.0.0-alpha1-universal.apk`**: Compatible across all Android phones and tablets.
            - **`SoundAmplifier-v1.0.0-alpha1-armeabi-v7a.apk`**: For older 32-bit Android phones.
            - **`SoundAmplifier-v1.0.0-alpha1-x86_64.apk`**: For Android emulators & Chromebooks.

            ### Features in this Alpha Release:
            - Modern adaptive app launcher icon with glowing amber lightning and audio ripples.
            - 1:1 match of the dark console UI with thick tactile 56dp capsule sliders.
            - 32-bar real-time Output Spectrum Power visualizer with dB readout.
            - Interactive ongoing notification panel progress slider with `[−10%]`, `[+10%]`, `[Max]`, `[Pause]` quick actions.
            - Built-in crash diagnostics system saving detailed reports to `/storage/emulated/0/Android/data/io.github.kg6k.soundamplifier/files/crash_reports/`.
            - Android 10 (API 29) through Android 15 (API 35) support.
          files: release-output/*.apk
          draft: false
          prerelease: true
