<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B2366" />
      <stop offset="60%" stop-color="#211736" />
      <stop offset="100%" stop-color="#141218" />
    </radialGradient>

    <!-- Gold Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientRipples" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="112" ry="112" fill="none" stroke="#4C3575" stroke-width="4" opacity="0.6" />

  <!-- Background Decorative Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2D2147" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#3D2B63" stroke-width="3.5" opacity="0.6" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="#533B85" stroke-width="4" opacity="0.8" />

  <!-- Outer Sound Wave Arcs -->
  <g filter="url(#ambientRipples)" stroke="#D0BCFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.75">
    <!-- Right outer arc -->
    <path d="M 350,180 A 120,120 0 0,1 350,332" />
    <!-- Left outer arc -->
    <path d="M 162,180 A 120,120 0 0,0 162,332" />
  </g>

  <!-- Mid Sound Wave Arcs -->
  <g filter="url(#neonGlow)" stroke="#EADDFF" stroke-width="18" stroke-linecap="round" fill="none">
    <!-- Right mid arc -->
    <path d="M 315,205 A 75,75 0 0,1 315,307" />
    <!-- Left mid arc -->
    <path d="M 197,205 A 75,75 0 0,0 197,307" />
  </g>

  <!-- Center Circle Container -->
  <circle cx="256" cy="256" r="82" fill="#2E1C4D" stroke="#7C52C7" stroke-width="7" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#B69DF8" stroke-width="2" opacity="0.8" />

  <!-- Center Golden Lightning Bolt -->
  <g filter="url(#neonGlow)">
    <polygon points="268,175 212,250 252,250 244,337 300,262 260,262" fill="url(#boltGrad)" />
    <!-- Inner Accent Highlight -->
    <polygon points="268,175 228,250 254,250 248,305 284,262 262,262" fill="#FEF08A" opacity="0.7" />
  </g>
</svg>
