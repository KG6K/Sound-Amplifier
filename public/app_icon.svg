<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle dark gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#141122" />
      <stop offset="70%" stop-color="#0a0812" />
      <stop offset="100%" stop-color="#06050b" />
    </radialGradient>
    <!-- Capsule glow -->
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Thin Purple Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#6834cd" stroke-width="4.5" opacity="0.85" />

  <!-- Left Lavender Pill Arc Accent -->
  <path
    d="M 109.4,141.5 A 186,186 0 0,0 109.4,370.5"
    fill="none"
    stroke="#aa80f9"
    stroke-width="17"
    stroke-linecap="round"
    filter="url(#pillGlow)"
  />

  <!-- Right Lavender Pill Arc Accent -->
  <path
    d="M 402.6,141.5 A 186,186 0 0,1 402.6,370.5"
    fill="none"
    stroke="#aa80f9"
    stroke-width="17"
    stroke-linecap="round"
    filter="url(#pillGlow)"
  />

  <!-- Inner Deep Purple Disc with Border -->
  <circle
    cx="256"
    cy="256"
    r="136"
    fill="#4a18b7"
    stroke="#6c33e2"
    stroke-width="16"
  />

  <!-- Yellow Sound Amplifier Speaker (Hollow outline with 17px stroke) -->
  <path
    d="M 158,224 L 194,224 L 244,174 L 244,338 L 194,288 L 158,288 Z"
    fill="none"
    stroke="#ffe600"
    stroke-width="17"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Sound Waves (Two Vivid Yellow Concentric Arcs) -->
  <path
    d="M 276,218 A 52,52 0 0,1 276,294"
    fill="none"
    stroke="#ffe600"
    stroke-width="17"
    stroke-linecap="round"
  />

  <path
    d="M 316,186 A 92,92 0 0,1 316,326"
    fill="none"
    stroke="#ffe600"
    stroke-width="17"
    stroke-linecap="round"
  />
</svg>
